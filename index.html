<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#233354">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trophy build sheets — LyteWork Engraving</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="./" aria-label="Trophy build sheets home">
      <svg viewBox="0 0 5000 5000" aria-hidden="true"><path id="crownPath" d=""/></svg>
      <span><b>Trophy build sheets</b><small>LyteWork Engraving</small></span>
    </a>
    <button class="bar-btn" id="btnOrders"><span class="lg">Saved </span>orders</button>
    <button class="bar-btn" id="btnNew">New<span class="lg"> order</span></button>
  </div>
</header>

<main class="wrap" id="orderView">
  <section class="ticket" aria-label="Order details">
    <div class="ticket-row">
      <label class="fld fld-no"><span>Order #</span><input id="fNo" autocomplete="off" placeholder="2026-0142"></label>
      <label class="fld fld-cust"><span>Customer</span><input id="fCust" autocomplete="off" placeholder="Who it's for"></label>
      <label class="fld fld-due"><span>Due</span><input id="fDue" type="date"></label>
    </div>
    <label class="fld"><span>Order notes <small class="fld-hint">for the shop</small></span><textarea id="fNotes" rows="2" placeholder="Pickup or delivery, anything the builders should know"></textarea></label>
    <label class="fld"><span>Customer notes <small class="fld-hint">from or for the customer</small></span><textarea id="fCustNotes" rows="2" placeholder="What the customer asked for, or what to tell them"></textarea></label>
    <label class="fld"><span>Message on the quote <small class="fld-hint">blank = your usual thank-you</small></span><input id="fQuoteMsg" autocomplete="off" placeholder="Thank you for the opportunity to make your awards."></label>
    <div class="price-row">
      <label class="toggle"><input type="checkbox" id="fRush"><span>Rush job <small id="rushPct">+25% up-charge</small></span></label>
      <label class="rate">Order discount <input id="fDisc" type="number" inputmode="decimal" min="0" max="100" step="1" placeholder="0"><span>%</span></label>
      <button class="btn-text" id="btnSettings" type="button">Shop settings</button>
    </div>
    <div class="save-state" id="saveState"></div>
  </section>

  <div class="sec-head">
    <h2>Trophies <span id="trophyCount"></span></h2>
    <button class="btn btn-accent" id="btnAdd">Add trophy</button>
  </div>
  <div id="trophyList"></div>
  <section id="addonSection"><div class="sec-head"><h2>Add-on items <span id="addonCount"></span></h2><button class="btn btn-quiet" id="btnAddon">Add item</button></div><p class="addon-hint">Anything that isn't a trophy — extra plates, plaques, medals. You set the price; it's added to the quote and shows on the build sheet.</p><div id="addonList"></div></section>
  <div id="pickPreview"></div>
</main>

<nav class="actionbar" aria-label="Order actions">
  <button class="btn btn-quiet" id="btnSave">Save</button>
  <button class="btn btn-quiet" id="btnChecklist">Checklist</button>
  <button class="btn btn-quiet" id="btnQuote">Quote</button>
  <button class="btn btn-quiet" id="btnMore" aria-haspopup="menu">More</button>
  <button class="btn btn-primary" id="btnSheet">Build sheet</button>
</nav>

<section class="editor" id="editor" hidden aria-label="Edit trophy">
  <header class="ed-bar">
    <button class="ed-back" id="edBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Order</button>
    <h2 id="edTitle">Trophy</h2>
    <button class="btn btn-accent" id="edDone">Done</button>
  </header>
  <div class="ed-body">
    <div class="ed-stage">
      <div class="ed-render" id="edRender"></div>
      <p class="ed-height" id="edHeight"></p>
    </div>
    <div class="ed-form" id="edForm"></div>
  </div>
</section>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div id="layer"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
