<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Quote — LyteWork Engraving</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/quote.css">
</head>
<body class="q-body">
<div class="toolbar no-print">
  <b>Customer quote</b>
  <a href="./">Back to order</a>
  <button class="go" id="btnPrint">Save as PDF</button>
</div>
<p class="tip no-print">To send it: <b>Save as PDF</b>, then choose <b>Save as PDF</b> as the printer. Only the customer's information is on this page — no SKUs, costs or shop notes.</p>
<div id="q"><p class="q-msg">Loading…</p></div>
<script>
  // plain script, so this works even if something else on the page fails
  document.getElementById('btnPrint').onclick = () => window.print();
</script>
<script type="module">
  import { quoteHTML } from './js/quote.js';
  import { normalizeOrder, applySettings, itemInfo } from './js/engine.js';
  import { measure } from './js/artfit.js';
  import { ART } from './js/data/figures.js';
  const box = document.getElementById('q');
  try {
    const data = JSON.parse(localStorage.getItem('tbs:quote') || 'null');
    if (!data) throw new Error('No order to quote. Open an order and press Quote.');
    if (data.settings) applySettings(data.settings);
    const order = normalizeOrder(data.order).order;
    document.title = `Quote${order.orderNo ? ' ' + order.orderNo : ''}${order.customer ? ' — ' + order.customer : ''} — LyteWork Engraving`;
    const urls = [ART.cup, ART.eagle, ...order.trophies.flatMap(t => [t.figure, t.trim, t.middle].map(r => (itemInfo(r) || {}).url))];
    await measure(urls, { timeout: 4000 });
    box.innerHTML = quoteHTML(order);
  } catch (e) {
    box.innerHTML = `<p class="q-msg">${String(e.message).replace(/</g, '&lt;')}</p>`;
  }
</script>
</body>
</html>
