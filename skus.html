<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#233354">
<meta name="robots" content="noindex, nofollow">
<title>Match figures to JDS SKUs — LyteWork Engraving</title>
<link rel="icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .sk-wrap{ max-width:1080px; margin:0 auto; padding:18px 16px 120px; }
  .sk-top{ display:grid; grid-template-columns:200px 1fr; gap:22px; align-items:start; background:var(--white); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:18px; }
  .sk-mine{ text-align:center; }
  .sk-mine .art{ height:180px; background:radial-gradient(ellipse at 50% 35%,#fff,#e9ecf1); border-radius:12px; display:flex; align-items:center; justify-content:center; padding:8px; }
  .sk-mine img{ max-width:100%; max-height:100%; object-fit:contain; }
  .sk-mine h2{ font-family:var(--display); font-size:20px; margin-top:8px; }
  .sk-mine p{ margin:2px 0 0; color:var(--muted); font-size:13px; }
  .sk-picked{ margin-top:10px; padding:8px; border-radius:8px; background:var(--gold-soft); font-size:13px; }
  .sk-side h3{ font-size:15px; margin-bottom:8px; }
  .sk-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; max-height:58vh; overflow:auto; }
  .sk-cand{ background:#fbfbfc; border:1.5px solid var(--line); border-radius:var(--r); padding:8px 6px; font-size:12.5px; line-height:1.25; text-align:center; }
  .sk-cand:hover{ border-color:var(--navy-soft); }
  .sk-cand[aria-pressed="true"]{ border-color:var(--navy); background:var(--gold-soft); }
  .sk-cand .im{ height:110px; display:flex; align-items:center; justify-content:center; }
  .sk-cand img{ max-width:100%; max-height:100%; object-fit:contain; }
  .sk-cand b{ display:block; color:var(--navy); }
  .sk-cand .nm{ display:block; margin:1px 0 3px; }
  .sk-cand small{ display:block; color:var(--muted); }
  .sk-bar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:14px 2px; }
  .sk-bar .grow{ flex:1; min-width:160px; }
  .sk-prog{ height:8px; background:#dfe3ea; border-radius:99px; overflow:hidden; flex:1; min-width:120px; }
  .sk-prog i{ display:block; height:100%; background:var(--gold); }
  .sk-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:16px; }
  .sk-chip{ display:flex; gap:8px; align-items:center; background:var(--white); border:1px solid var(--line); border-radius:10px; padding:6px 8px; font-size:12.5px; text-align:left; }
  .sk-chip img{ width:34px; height:34px; object-fit:contain; }
  .sk-chip[data-done="1"]{ border-color:var(--ok); background:#f1f7f3; }
  .sk-chip b{ display:block; }
  .sk-chip small{ color:var(--muted); }
  @media (max-width:760px){ .sk-top{ grid-template-columns:1fr; } .sk-grid{ max-height:none; } }
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="brand" href="./"><svg viewBox="0 0 5000 5000" aria-hidden="true"><path id="crownPath" d=""/></svg><span><b>Match figures to SKUs</b><small>LyteWork Engraving</small></span></a>
  <button class="bar-btn" id="btnSave">Download figures.js</button>
  <button class="bar-btn" id="btnCopy">Copy as JSON</button>
</div></header>
<main class="sk-wrap" id="main">Loading…</main>
<div id="layer"></div>
<script type="module" src="js/skumatch.js"></script>
</body>
</html>
